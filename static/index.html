<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>pingping — link quality oscilloscope</title>
<style>
  :root {
    --bg:#0a0c0e; --panel:#101613; --screen:#060808; --line:#1e242a;
    --phos:#7ce38b; --amber:#e8b44a; --alert:#ff5c57; --ink:#c7d0c9; --dim:#5c6b60;
    --grid-axis:#2a332c; --grid-split:#10281a;
    --smoke:rgba(124,227,139,.16); --lossbar:rgba(255,92,87,.55); --glow:6;
    --mono: ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Noto Sans Mono",monospace;
  }
  /* Daylight: warm paper — the trace printed on lab graph paper */
  html[data-theme="daylight"] {
    --bg:#f4f1e8; --panel:#faf8f1; --screen:#fffef9; --line:#e0dbc9;
    --phos:#177245; --amber:#986a00; --alert:#c23a32; --ink:#2b2f28; --dim:#8b8a7a;
    --grid-axis:#cfc9b4; --grid-split:#ebe6d4;
    --smoke:rgba(23,114,69,.20); --lossbar:rgba(194,58,50,.5); --glow:0;
  }
  /* Arctic: cool morning light — teal trace on frosted glass */
  html[data-theme="arctic"] {
    --bg:#edf1f5; --panel:#f6f9fb; --screen:#fbfdfe; --line:#d7e0e8;
    --phos:#0b7285; --amber:#b45309; --alert:#d1433f; --ink:#24313d; --dim:#7f8f9d;
    --grid-axis:#c3d0db; --grid-split:#e3ebf2;
    --smoke:rgba(11,114,133,.18); --lossbar:rgba(209,67,63,.5); --glow:0;
  }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:var(--mono); padding:18px 22px; }
  header { display:flex; align-items:baseline; gap:14px; margin-bottom:14px; flex-wrap:wrap; }
  .mark { color:var(--phos); font-weight:700; font-size:20px; letter-spacing:.05em; }
  .tag { color:var(--dim); font-size:12px; }
  .row { display:flex; gap:12px; align-items:flex-start; margin-bottom:14px; flex-wrap:wrap; }
  .pills { display:flex; gap:8px; flex-wrap:wrap; }
  .pill { font-family:var(--mono); font-size:13px; background:var(--panel); color:var(--ink);
          border:1px solid var(--line); border-radius:4px; padding:7px 14px; cursor:pointer;
          display:flex; align-items:center; gap:8px; }
  .pill.on { border-color:var(--phos); color:var(--phos); }
  .led { width:8px; height:8px; border-radius:50%; background:var(--phos); box-shadow:0 0 6px var(--phos); }
  .led.bad { background:var(--alert); box-shadow:0 0 6px var(--alert); }
  .rng { display:flex; background:var(--panel); border:1px solid var(--line); border-radius:4px; overflow:hidden; }
  .rng span { color:var(--dim); font-size:11px; padding:8px 10px 0 12px; letter-spacing:.1em; }
  .rng button { font-family:var(--mono); font-size:12px; background:none; border:0; color:var(--dim);
                padding:8px 14px; cursor:pointer; }
  .rng button.on { background:#1a2018; color:var(--amber); }
  .scope { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:14px; }
  #chart { height:420px; background:var(--screen); border-radius:4px; }
  .readouts { display:flex; gap:34px; margin-top:12px; flex-wrap:wrap; align-items:flex-end; }
  .ro .v { font-size:24px; color:var(--phos); }
  .ro .v.bad { color:var(--alert); }
  .ro .l { font-size:10px; color:var(--dim); letter-spacing:.12em; margin-top:2px; }
  .sp { flex:1; }
  footer { margin-top:12px; color:var(--dim); font-size:12px; display:flex; gap:10px; flex-wrap:wrap; }
  #conclusion { color:var(--ink); }
  .legend { color:var(--dim); }
</style>
</head>
<body>
<header>
  <div class="mark">pingping ●</div>
  <div class="tag">link quality oscilloscope · monitoring tells you if it's down, pingping tells you how well it lives</div>
  <button class="pill" id="themeBtn" title="switch theme" style="margin-left:auto">◐ <span id="themeName">dark</span></button>
</header>

<div class="row">
  <div class="rng" id="tfilter" style="display:none">
    <button data-t="all" class="on">All</button>
    <button data-t="icmp">PING</button>
    <button data-t="tcp">TCP</button>
  </div>
  <div class="pills" id="pills"></div>
</div>

<div class="scope">
  <div id="chart"></div>
  <div class="readouts">
    <div class="ro"><div class="v" id="p50">–</div><div class="l">P50 MS</div></div>
    <div class="ro"><div class="v" id="p90">–</div><div class="l">P90 MS</div></div>
    <div class="ro"><div class="v" id="p99">–</div><div class="l">P99 MS</div></div>
    <div class="ro"><div class="v" id="loss">–</div><div class="l">LOSS %</div></div>
    <div class="ro"><div class="v" id="bursts">–</div><div class="l">BURSTS · WINDOW</div></div>
    <div class="sp"></div>
    <div class="rng">
      <span>TIME/DIV</span>
      <button data-m="60">1h</button>
      <button data-m="360" class="on">6h</button>
      <button data-m="720">12h</button>
      <button data-m="1440">24h</button>
      <button data-d="7">7d</button>
      <button data-d="30">1M</button>
      <button data-d="90">3M</button>
      <button data-d="180">6M</button>
      <button data-d="300">ALL</button>
    </div>
  </div>
</div>

<footer>
  <span id="conclusion"></span>
  <span class="legend">Line = per-round median · Smoke = all samples · Red bars = loss% · ◆ = burst</span>
</footer>

<script src="/static/echarts.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const THEMES = ['dark', 'daylight', 'arctic'];
let theme = localStorage.getItem('pp_theme') || 'dark';
if (!THEMES.includes(theme)) theme = 'dark';
function applyTheme() {
  if (theme === 'dark') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = theme;
  const el = $('themeName'); if (el) el.textContent = theme;
}
applyTheme();
let targets = [], current = null, minutes = 360, days = 0, typeFilter = 'all';

// Deep link: /#t=NAME&m=1440 — send "this link, this window" to a colleague
const hp = new URLSearchParams(location.hash.slice(1));
if (hp.get('m') && [60,360,720,1440].includes(+hp.get('m'))) minutes = +hp.get('m');
if (hp.get('t')) current = hp.get('t');
document.querySelectorAll('.rng button[data-m]').forEach(b => b.classList.toggle('on', +b.dataset.m === minutes));

const chart = echarts.init($('chart'));

async function loadTargets() {
  targets = await (await fetch('/api/targets')).json() || [];
  const kinds = new Set(targets.map(t => t.type));
  $('tfilter').style.display = kinds.size > 1 ? '' : 'none';
  const visible = targets.filter(t => typeFilter === 'all' || t.type === typeFilter);
  const pills = $('pills'); pills.innerHTML = '';
  visible.forEach(t => {
    const b = document.createElement('button');
    b.className = 'pill' + (t.name === current ? ' on' : '');
    b.innerHTML = `<span class="led${t.down ? ' bad' : ''}"></span>${t.name}`;
    b.onclick = () => { current = t.name; render(); };
    pills.appendChild(b);
  });
  if ((!current || !visible.some(t => t.name === current)) && visible.length) current = visible[0].name;
}

async function render() {
  await loadTargets();
  const t = targets.find(x => x.name === current);
  if (!t) return;
  if (days > 0) { await renderBand(t); return; }
  const rounds = await (await fetch(`/api/series?target=${encodeURIComponent(current)}&minutes=${minutes}`)).json() || [];

  const smoke = [], median = [], lossBars = [], burstPts = [];
  let sent = 0, recv = 0, bursts = 0;
  const pool = [];
  rounds.forEach(r => {
    const ts = r.t * 1000;
    (r.ms || []).forEach(v => { smoke.push([ts, v]); pool.push(v); });
    if (r.ms && r.ms.length) {
      const s = [...r.ms].sort((a,b)=>a-b);
      median.push([ts, s[Math.floor(s.length/2)]]);
    }
    sent += r.s; recv += r.r;
    const lp = r.s ? (r.s - r.r) / r.s * 100 : 0;
    if (lp > 0) lossBars.push([ts, lp]);
    if (r.b) { bursts++; burstPts.push([ts, lp, r.z || 0, r.s - r.r, r.s]); }
  });
  pool.sort((a,b)=>a-b);
  const q = p => pool.length ? pool[Math.min(pool.length-1, Math.floor(pool.length*p))] : 0;
  const lossPct = sent ? (sent-recv)/sent*100 : 0;

  $('p50').textContent = pool.length ? q(.5).toFixed(1) : '–';
  $('p90').textContent = pool.length ? q(.9).toFixed(1) : '–';
  $('p99').textContent = pool.length ? q(.99).toFixed(1) : '–';
  $('loss').textContent = lossPct.toFixed(2);
  $('loss').className = 'v' + (lossPct > 1 ? ' bad' : '');
  $('bursts').textContent = bursts;
  $('bursts').className = 'v' + (bursts ? ' bad' : '');

  const win = minutes === 60 ? '1h' : minutes === 360 ? '6h' : '24h';
  $('conclusion').textContent = (t.down ? '🔴 ' : '🟢 ') + `${t.name}: ${win} P99 ${pool.length ? q(.99).toFixed(1) : '–'} ms · loss ${lossPct.toFixed(2)}% · ${bursts} bursts`;

  const phos = cssv('--phos');
  chart.setOption({
    animation: false,
    grid: { left: 52, right: 46, top: 18, bottom: 42 },
    xAxis: { type: 'time', axisLine: { lineStyle: { color: cssv('--grid-axis') } },
             axisLabel: { color: cssv('--dim'), fontSize: 10 }, splitLine: { lineStyle: { color: cssv('--grid-split') } } },
    yAxis: [
      { type: 'value', name: 'RTT ms', nameTextStyle: { color: cssv('--dim'), fontSize: 10 },
        axisLabel: { color: cssv('--dim'), fontSize: 10 }, splitLine: { lineStyle: { color: cssv('--grid-split') } } },
      { type: 'value', max: 100, show: false }
    ],
    tooltip: { backgroundColor: cssv('--panel'), borderColor: cssv('--line'),
               textStyle: { color: cssv('--ink'), fontSize: 11, fontFamily: 'monospace' } },
    series: [
      { type: 'scatter', data: smoke, symbolSize: 2, silent: true,
        itemStyle: { color: cssv('--smoke') }, large: true },
      { type: 'line', data: median, showSymbol: false,
        lineStyle: { color: phos, width: 1.6, shadowColor: phos, shadowBlur: +cssv('--glow') }, z: 5 },
      { type: 'bar', yAxisIndex: 1, data: lossBars, barMaxWidth: 3,
        itemStyle: { color: cssv('--lossbar') } },
      { type: 'scatter', yAxisIndex: 1, data: burstPts, symbol: 'diamond',
        symbolSize: 9, itemStyle: { color: cssv('--alert') }, z: 6,
        tooltip: { formatter: p => `◆ z-score ${p.value[2] ? p.value[2].toFixed(2) : '—'} · loss ${p.value[1].toFixed(0)}% (${p.value[3]}/${p.value[4]})` } }
    ]
  }, true);
}

document.querySelectorAll('.rng button[data-m], .rng button[data-d]').forEach(b => b.onclick = () => {
  document.querySelectorAll('.rng button[data-m], .rng button[data-d]').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  if (b.dataset.d) { days = +b.dataset.d; minutes = 0; }
  else { minutes = +b.dataset.m; days = 0; }
  render();
});
document.querySelectorAll('#tfilter button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#tfilter button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  typeFilter = b.dataset.t;
  render();
});

render();
setInterval(render, 60000);
// Long windows: smoke is a hot-data privilege — beyond 24h you get the
// P50 line, a P50–P99 band, loss bars and burst counts from server-side buckets.
async function renderBand(t) {
  const rows = await (await fetch(`/api/band?target=${encodeURIComponent(current)}&days=${days}`)).json() || [];
  const p50 = [], band = [], loss = [], bursts = [];
  let lossW = 0, nSum = 0, burstSum = 0, p99max = 0, p50W = 0, p90W = 0;
  rows.forEach(r => {
    const ts = r.t * 1000;
    p50.push([ts, r.p50]);
    band.push([ts, r.p50, r.p99]);
    if (r.loss > 0) loss.push([ts, r.loss]);
    if (r.b) { bursts.push([ts, Math.min(r.loss, 100), r.b]); burstSum += r.b; }
    lossW += r.loss * r.n; p50W += r.p50 * r.n; p90W += r.p90 * r.n; nSum += r.n;
    if (r.p99 > p99max) p99max = r.p99;
  });
  const lp = nSum ? lossW / nSum : 0;
  $('p50').textContent = nSum ? (p50W/nSum).toFixed(1) : '–';
  $('p90').textContent = nSum ? (p90W/nSum).toFixed(1) : '–';
  $('p99').textContent = nSum ? p99max.toFixed(1) : '–';
  $('loss').textContent = lp.toFixed(2); $('loss').className = 'v' + (lp > 1 ? ' bad' : '');
  $('bursts').textContent = burstSum; $('bursts').className = 'v' + (burstSum ? ' bad' : '');
  const win = days >= 300 ? 'all' : days >= 30 ? (days/30) + 'M' : days + 'd';
  $('conclusion').textContent = (t.down ? '🔴 ' : '🟢 ') + `${t.name}: ${win} peak P99 ${p99max.toFixed(1)} ms · loss ${lp.toFixed(2)}% · ${burstSum} bursts`;
  const phos = cssv('--phos');
  chart.setOption({
    animation: false,
    grid: { left: 52, right: 46, top: 18, bottom: 42 },
    tooltip: { backgroundColor: cssv('--panel'), borderColor: cssv('--line'),
               textStyle: { color: cssv('--ink'), fontSize: 11, fontFamily: 'monospace' } },
    xAxis: { type: 'time', axisLine: { lineStyle: { color: cssv('--grid-axis') } },
             axisLabel: { color: cssv('--dim'), fontSize: 10 }, splitLine: { lineStyle: { color: cssv('--grid-split') } } },
    yAxis: [
      { type: 'value', name: 'RTT ms', nameTextStyle: { color: cssv('--dim'), fontSize: 10 },
        axisLabel: { color: cssv('--dim'), fontSize: 10 }, splitLine: { lineStyle: { color: cssv('--grid-split') } } },
      { type: 'value', max: 100, show: false }
    ],
    series: [
      { type: 'custom', renderItem: (p, api) => {
          const lo = api.coord([api.value(0), api.value(1)]), hi = api.coord([api.value(0), api.value(2)]);
          return { type: 'rect', shape: { x: lo[0]-1.5, y: hi[1], width: 3, height: Math.max(lo[1]-hi[1],1) },
                   style: { fill: cssv('--smoke') } };
        }, data: band, silent: true },
      { type: 'line', data: p50, showSymbol: false,
        lineStyle: { color: phos, width: 1.5, shadowColor: phos, shadowBlur: +cssv('--glow') }, z: 5 },
      { type: 'bar', yAxisIndex: 1, data: loss, barMaxWidth: 3,
        itemStyle: { color: cssv('--lossbar') } },
      { type: 'scatter', yAxisIndex: 1, data: bursts, symbol: 'diamond', symbolSize: 8,
        itemStyle: { color: cssv('--alert') }, z: 6,
        tooltip: { formatter: p => `◆ ${p.value[2]} bursts · loss ${p.value[1].toFixed(1)}%` } }
    ]
  }, true);
}

$('themeBtn').onclick = () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
  localStorage.setItem('pp_theme', theme);
  applyTheme();
  render();
};
window.addEventListener('resize', () => chart.resize());
</script>
</body>
</html>
