<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pingd · 链路质量示波器</title>
<script src="/static/echarts.min.js"></script>
<style>
  /* 主题:老式示波器。荧光迹线是唯一的主角,其余一切保持仪器面板的沉默。 */
  :root {
    --bg: #0a0c0e;         /* 机壳 */
    --bezel: #14181c;      /* 面板 */
    --screen: #060808;     /* 荧幕 */
    --phos: #7ce38b;       /* P1 荧光粉 */
    --phos-dim: rgba(124,227,139,.16);
    --grid: #10281a;
    --amber: #e8b44a;      /* 档位旋钮 */
    --alert: #ff5c57;
    --ink: #c7d0c9;
    --dim: #5c6b60;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, "Noto Sans Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--mono); padding: 20px; }
  .wrap { max-width: 1100px; margin: 0 auto; }

  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .mark { font-size: 22px; letter-spacing: .04em; color: var(--phos); }
  .mark b { font-weight: 700; }
  .tagline { color: var(--dim); font-size: 12px; }
  header .sp { flex: 1; }
  button.push {
    background: none; border: 1px solid var(--amber); color: var(--amber);
    font: inherit; font-size: 12px; padding: 6px 14px; border-radius: 3px; cursor: pointer;
  }
  button.push:hover { background: rgba(232,180,74,.12); }
  button.push:focus-visible, .pill:focus-visible, .rng button:focus-visible { outline: 1px dashed var(--amber); outline-offset: 2px; }

  .pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .pill {
    background: var(--bezel); border: 1px solid #1e242a; color: var(--ink);
    font: inherit; font-size: 12px; padding: 6px 12px; border-radius: 3px; cursor: pointer;
    display: flex; align-items: center; gap: 7px;
  }
  .pill.on { border-color: var(--phos); }
  .led { width: 7px; height: 7px; border-radius: 50%; background: var(--phos); box-shadow: 0 0 5px var(--phos); }
  .led.bad { background: var(--alert); box-shadow: 0 0 6px var(--alert); animation: blink 1.2s infinite; }
  @media (prefers-reduced-motion: reduce) { .led.bad { animation: none; } }
  @keyframes blink { 50% { opacity: .35; } }

  .scope {
    background: var(--bezel); border-radius: 6px; padding: 14px;
    border: 1px solid #1e242a; box-shadow: inset 0 1px 0 rgba(255,255,255,.03);
  }
  #chart { height: 420px; background: var(--screen); border-radius: 3px; }

  .console { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; margin-top: 12px; padding: 0 4px; }
  .readout { min-width: 86px; }
  .readout .v { font-size: 22px; color: var(--phos); }
  .readout .v.bad { color: var(--alert); }
  .readout .k { font-size: 10px; color: var(--dim); letter-spacing: .14em; text-transform: uppercase; margin-top: 2px; }
  .console .sp { flex: 1; }
  .rng { display: flex; gap: 0; border: 1px solid #1e242a; border-radius: 3px; overflow: hidden; }
  .rng button {
    background: none; border: none; color: var(--dim); font: inherit; font-size: 12px;
    padding: 6px 14px; cursor: pointer; border-right: 1px solid #1e242a;
  }
  .rng button:last-child { border-right: none; }
  .rng button.on { color: var(--amber); background: rgba(232,180,74,.09); }
  .rng .lbl { font-size: 10px; color: var(--dim); align-self: center; padding: 0 8px; letter-spacing: .14em; }

  .foot { color: var(--dim); font-size: 11px; margin-top: 16px; display: flex; gap: 14px; flex-wrap: wrap; }
  .foot .conc { color: var(--ink); }
  .toast { position: fixed; right: 20px; bottom: 20px; background: var(--bezel); border: 1px solid var(--phos);
           color: var(--phos); padding: 10px 16px; border-radius: 3px; font-size: 12px; display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark"><b>pingd</b> ●</div>
    <div class="tagline">链路质量示波器 · 监控告诉你挂没挂,pingd 告诉你活得好不好</div>
    <div class="sp"></div>
    <button class="push" id="push">推送实时报告到飞书</button>
  </header>

  <div class="pills" id="pills"></div>

  <div class="scope">
    <div id="chart"></div>
    <div class="console">
      <div class="readout"><div class="v" id="p50">–</div><div class="k">P50 ms</div></div>
      <div class="readout"><div class="v" id="p90">–</div><div class="k">P90 ms</div></div>
      <div class="readout"><div class="v" id="p99">–</div><div class="k">P99 ms</div></div>
      <div class="readout"><div class="v" id="loss">–</div><div class="k">丢包 %</div></div>
      <div class="readout"><div class="v" id="bursts">–</div><div class="k">突发·窗口内</div></div>
      <div class="sp"></div>
      <div class="rng">
        <span class="lbl">TIME/DIV</span>
        <button data-m="60">1h</button>
        <button data-m="360" class="on">6h</button>
        <button data-m="1440">24h</button>
      </div>
    </div>
  </div>

  <div class="foot">
    <span class="conc" id="conclusion"></span>
    <span>亮线 = 每轮中位数 · 烟雾 = 全部样本 · 红柱 = 丢包% · ◆ = 突发</span>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let targets = [], current = null, minutes = 360;
const chart = echarts.init($('chart'), null, { renderer: 'canvas' });

async function loadTargets() {
  targets = await (await fetch('/api/targets')).json() || [];
  const pills = $('pills'); pills.innerHTML = '';
  targets.forEach(t => {
    const b = document.createElement('button');
    b.className = 'pill' + (t.name === current ? ' on' : '');
    b.innerHTML = `<span class="led${t.status.alert ? ' bad' : ''}"></span>${t.name}`;
    b.onclick = () => { current = t.name; render(); };
    pills.appendChild(b);
  });
  if (!current && targets.length) current = targets[0].name;
}

async function render() {
  await loadTargets();
  const t = targets.find(x => x.name === current);
  if (!t) return;
  const rounds = await (await fetch(`/api/series?target=${encodeURIComponent(current)}&minutes=${minutes}`)).json() || [];

  // 烟雾:全部样本;迹线:每轮中位数;红柱:丢包%;突发:菱形标记
  const smoke = [], median = [], lossBars = [], burstPts = [];
  let pool = [], sent = 0, recv = 0, bursts = 0;
  rounds.forEach(r => {
    const ts = r.t * 1000, ms = r.ms || [];
    ms.forEach(v => smoke.push([ts, v]));
    pool = pool.concat(ms);
    sent += r.s; recv += r.r;
    if (ms.length) {
      const c = [...ms].sort((a, b) => a - b);
      median.push([ts, c[Math.floor(c.length / 2)]]);
    } else {
      median.push([ts, null]);
    }
    const lp = r.s ? (r.s - r.r) / r.s * 100 : 0;
    lossBars.push([ts, lp]);
    if (r.b) { bursts++; burstPts.push([ts, lp]); }
  });

  pool.sort((a, b) => a - b);
  const q = p => pool.length ? pool[Math.floor((pool.length - 1) * p)] : 0;
  $('p50').textContent = pool.length ? q(.5).toFixed(1) : '–';
  $('p90').textContent = pool.length ? q(.9).toFixed(1) : '–';
  $('p99').textContent = pool.length ? q(.99).toFixed(1) : '–';
  const lossPct = sent ? ((sent - recv) / sent * 100) : 0;
  $('loss').textContent = lossPct.toFixed(2);
  $('loss').className = 'v' + (lossPct > 1 ? ' bad' : '');
  $('bursts').textContent = bursts;
  $('bursts').className = 'v' + (bursts ? ' bad' : '');
  $('conclusion').textContent = t.status.alert
    ? `🔴 ${t.name}:${t.status.kind} —— 处理中` 
    : `🟢 ${t.name}:近 24h P99 ${t.last_24h.p99.toFixed(1)} ms · 丢包 ${t.last_24h.loss_pct.toFixed(2)}% · 突发 ${t.last_24h.bursts} 次`;

  const css = getComputedStyle(document.documentElement);
  const phos = css.getPropertyValue('--phos').trim();
  chart.setOption({
    animation: false,
    grid: { left: 52, right: 46, top: 18, bottom: 42 },
    tooltip: { trigger: 'axis', backgroundColor: '#14181c', borderColor: '#1e242a',
               textStyle: { color: '#c7d0c9', fontSize: 11, fontFamily: 'monospace' } },
    xAxis: { type: 'time', axisLine: { lineStyle: { color: '#2a332c' } },
             axisLabel: { color: '#5c6b60', fontSize: 10 }, splitLine: { lineStyle: { color: '#10281a' } } },
    yAxis: [
      { type: 'value', name: 'RTT ms', nameTextStyle: { color: '#5c6b60', fontSize: 10 },
        axisLabel: { color: '#5c6b60', fontSize: 10 }, splitLine: { lineStyle: { color: '#10281a' } } },
      { type: 'value', max: 100, show: false }
    ],
    series: [
      { name: '样本', type: 'scatter', data: smoke, symbolSize: 2.2, large: true,
        itemStyle: { color: 'rgba(124,227,139,.17)' }, silent: true },
      { name: '中位数', type: 'line', data: median, showSymbol: false, connectNulls: false,
        lineStyle: { color: phos, width: 1.6, shadowColor: phos, shadowBlur: 6 }, z: 5 },
      { name: '丢包%', type: 'bar', yAxisIndex: 1, data: lossBars, barMaxWidth: 3,
        itemStyle: { color: 'rgba(255,92,87,.55)' } },
      { name: '突发', type: 'scatter', yAxisIndex: 1, data: burstPts, symbol: 'diamond',
        symbolSize: 9, itemStyle: { color: '#ff5c57' }, z: 6 }
    ]
  }, true);
}

document.querySelectorAll('.rng button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.rng button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  minutes = +b.dataset.m;
  render();
});

$('push').onclick = async () => {
  const r = await (await fetch('/api/push', { method: 'POST' })).json();
  const t = $('toast'); t.textContent = r.ok || '已触发'; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2500);
};

window.addEventListener('resize', () => chart.resize());
render();
setInterval(render, 60000);
</script>
</body>
</html>
