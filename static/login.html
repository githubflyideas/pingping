<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pingping · login</title>
<script src="/static/i18n.js"></script>
<style>
  :root {
    --bg:#0a0c0e; --bezel:#14181c; --phos:#7ce38b; --amber:#e8b44a;
    --alert:#ff5c57; --ink:#c7d0c9; --dim:#5c6b60;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, "Noto Sans Mono", monospace;
  }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:var(--mono);
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { background:var(--bezel); border:1px solid #1e242a; border-radius:6px;
          padding:34px 32px; width:340px; box-shadow: inset 0 1px 0 rgba(255,255,255,.03); }
  .mark { font-size:22px; color:var(--phos); margin-bottom:4px; }
  .mark b { font-weight:700; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:24px; }
  label { display:block; font-size:10px; color:var(--dim); letter-spacing:.14em;
          text-transform:uppercase; margin:14px 0 5px; }
  input, select { width:100%; background:var(--bg); border:1px solid #1e242a; color:var(--ink);
          font:inherit; font-size:13px; padding:9px 10px; border-radius:3px; }
  input:focus, select:focus { outline:none; border-color:var(--phos); }
  button { width:100%; margin-top:22px; background:none; border:1px solid var(--amber);
           color:var(--amber); font:inherit; font-size:13px; padding:10px; border-radius:3px; cursor:pointer; }
  button:hover { background:rgba(232,180,74,.12); }
  .err { color:var(--alert); font-size:12px; margin-top:12px; min-height:16px; }
</style>
</head>
<body>
<div class="card">
  <div class="mark"><b>pingping</b> ●</div>
  <div class="sub" id="ttl"></div>
  <label id="lu" for="user"></label>
  <input id="user" autocomplete="username" autofocus>
  <label id="lp" for="pass"></label>
  <input id="pass" type="password" autocomplete="current-password">
  <label id="ll" for="lang"></label>
  <select id="lang"></select>
  <button id="go"></button>
  <div class="err" id="err"></div>
</div>
<script>
const $ = id => document.getElementById(id);
function apply() {
  $('ttl').textContent = T('loginTitle');
  $('lu').textContent = T('username');
  $('lp').textContent = T('password');
  $('ll').textContent = T('language');
  $('go').textContent = T('signin');
}
mountLangSelect($('lang'), apply);
apply();

async function login() {
  $('err').textContent = '';
  const r = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ User: $('user').value, Pass: $('pass').value }),
  });
  if (r.ok) { location.href = '/'; return; }
  $('err').textContent = T('loginFailed');
}
$('go').onclick = login;
$('pass').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
$('user').addEventListener('keydown', e => { if (e.key === 'Enter') $('pass').focus(); });
</script>
</body>
</html>
