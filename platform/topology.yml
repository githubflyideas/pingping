# 環境拓撲 —— AI 診斷時的第一份輸入。維護得越準，定位越快。
# 這份文件就是把「只有你腦子裡有的環境知識」交給 AI 的地方。

description: >
  私有雲，Proxmox 虛擬化。對外服務經 gw01 出口，
  國內用戶流量走電信線路進入 gw01，日本本地流量走 IIJ 線路。

agents:            # 主機名 -> sre-agent 只讀 API 地址
  gw01: 10.0.0.1:9911
  pve01: 10.0.0.11:9911
  pve02: 10.0.0.12:9911

paths:             # 流量路徑（診斷「XX訪問慢」時的候選鏈路）
  国内访问: [电信线路, gw01, pve01/pve02 上的虚机]
  日本本地: [IIJ线路, gw01]

dependencies:      # 組件依賴方向（判斷因果用）
  - "虚机网络 -> pve 宿主机 bridge -> gw01"

known_quirks:      # 已知怪癖（沉澱歷史案例結論）
  - "gw01 對 ICMP 有 rate limit，ping 丟包不代表鏈路劣化"
