name: quality

# Keeps three things from drifting: the router's complexity, the OpenAPI spec
# against the registered routes, and the sign-in page's Caps Lock hint in a
# real browser.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version: '1.27.4' }
      - name: gocyclo (router stays small)
        run: |
          go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0
          gocyclo -over 15 web.go stats.go
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22', cache: npm, cache-dependency-path: browser/package-lock.json }
      - name: OpenAPI lint
        run: npx --yes @redocly/cli@2.82.0 lint docs/openapi.yaml
      - name: Browser tests
        working-directory: browser
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          npm test
