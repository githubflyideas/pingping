openapi: 3.1.0
info:
  title: pingping HTTP API
  version: "1"
  summary: The API the pingping web UI and the console, its tray icon and the Zabbix template use.
  description: |
    Machine-readable form of [API.md](API.md); the rules there apply.
    Every `/api/` response carries `API-Version: 1`. Every error is
    `{"error", "code"}` (schema `Error`). A wrong method on a known path is
    `405` with an `Allow` header; an unknown path under `/api/` is `404`.

    "session" below means the `pingping_session` cookie from `POST /api/login`.
    An account is an `admin` or a `viewer`; a viewer gets `403` on anything that
    changes the instance. `GET /api/stats` is the only endpoint that takes a bearer
    token, and that token is read-only.

    `openapi_test.go` (`TestOpenAPIMatchesRoutes`) fails when this file and the
    routes the code registers differ.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /
    description: The pingping instance serving this API .
tags:
  - name: pages
    description: HTML pages and static files, outside `/api/`.
  - name: auth
    description: Sign in and out.
  - name: info
    description: Build and probe-type information.
  - name: accounts
    description: Accounts and console settings.
  - name: brand
    description: The custom logo.
  - name: targets
    description: Read and change what is probed.
  - name: data
    description: Measurements.
security:
  - session: []
paths:
  /:
    get:
      tags: [pages]
      operationId: getIndex
      summary: The console.
      security: []
      responses:
        "200":
          description: The page.
          content:
            text/html: {}
        "302":
          description: "Redirect: to `/setup` before the first account exists, else to `/login` when signed out."
          headers:
            Location:
              schema: { type: string }
        "405":
          description: Wrong method (plain text; not under `/api/`).
  /login:
    get:
      tags: [pages]
      operationId: getLoginPage
      summary: The sign-in page.
      security: []
      responses:
        "200":
          description: The page.
          content:
            text/html: {}
        "302":
          description: "Redirect: to `/setup` before the first account exists."
          headers:
            Location:
              schema: { type: string }
        "405":
          description: Wrong method (plain text; not under `/api/`).
  /setup:
    get:
      tags: [pages]
      operationId: getSetupPage
      summary: The first-run page.
      security: []
      responses:
        "200":
          description: The page.
          content:
            text/html: {}
        "302":
          description: "Redirect: to `/login` once an account exists."
          headers:
            Location:
              schema: { type: string }
        "405":
          description: Wrong method (plain text; not under `/api/`).
  /settings:
    get:
      tags: [pages]
      operationId: getSettingsPage
      summary: Accounts, port and logo settings.
      security: []
      responses:
        "200":
          description: The page.
          content:
            text/html: {}
        "302":
          description: "Redirect: to `/setup` before the first account exists, else to `/login` when signed out."
          headers:
            Location:
              schema: { type: string }
        "405":
          description: Wrong method (plain text; not under `/api/`).
  /static/{path}:
    get:
      tags: [pages]
      operationId: getStatic
      summary: Embedded static files (the route is the prefix `/static/`), with an ETag.
      security: []
      parameters:
        - name: path
          in: path
          required: true
          description: File path below `/static/`; may contain `/`.
          schema: { type: string }
      responses:
        "200":
          description: The file.
          content:
            "*/*": {}
        "304":
          description: Not modified (ETag matched).
        "404":
          description: No such file (plain text, not under `/api/`).
        "405":
          description: Wrong method (plain text; not under `/api/`).
  /api/setup:
    post:
      tags: [auth]
      operationId: setup
      summary: "First run only: create the admin account and sign in."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user: { type: string, description: Defaults to `admin`. }
                pass: { type: string }
      responses:
        "200":
          description: Account created; the session cookie is set.
          headers:
            Set-Cookie:
              description: "`pingping_session`; HttpOnly, SameSite=Lax, 7 days."
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in and get the session cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              description: "`pingping_session`; HttpOnly, SameSite=Lax, 7 days."
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out; the session also ends on the server. Safe without one.
      security: []
      responses:
        "200":
          description: Signed out; the cookie is cleared.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /api/password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change your own password; ends all your sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema: 
              type: object
              properties:
                old: { type: string }
                new: { type: string }
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /api/me:
    get:
      tags: [accounts]
      operationId: getMe
      summary: Who you are, and the console settings you may see.
      responses:
        "200":
          description: The signed-in account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /api/users:
    get:
      tags: [accounts]
      operationId: listUsers
      summary: Accounts and their roles (admin only).
      responses:
        "200":
          description: Accounts.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      tags: [accounts]
      operationId: createUser
      summary: Create an account (admin only).
      requestBody:
        required: true
        content:
          application/json:
            schema: 
              type: object
              properties:
                name: { type: string }
                pass: { type: string }
                role: { type: string, enum: [admin, viewer], description: Defaults to `viewer`. }
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /api/users/{name}/password:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [accounts]
      operationId: setUserPassword
      summary: Set another account's password (admin only); ends its sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema: 
              type: object
              properties:
                pass: { type: string }
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /api/users/{name}/role:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [accounts]
      operationId: setUserRole
      summary: Change an account's role (admin only); ends its sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema: 
              type: object
              properties:
                role: { type: string, enum: [admin, viewer] }
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /api/users/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [accounts]
      operationId: deleteUser
      summary: "Delete an account (admin only): not your own, not the last admin."
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/settings/port:
    post:
      tags: [accounts]
      operationId: setConsolePort
      summary: Console port and bind address for the next start (admin only).
      requestBody:
        required: true
        content:
          application/json:
            schema: 
              type: object
              properties:
                port: { type: integer, description: 0 leaves it unchanged. }
                bind: { type: string, description: Empty leaves it unchanged. }
      responses:
        "200":
          description: Stored; applied after a restart.
          content:
            application/json:
              schema:
                type: object
                required: [ok, port, bind, applied, note]
                properties:
                  ok: { type: boolean }
                  port: { type: integer }
                  bind: { type: string }
                  applied: { type: boolean, const: false }
                  note: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /api/health:
    get:
      tags: [info]
      operationId: getHealth
      summary: Counts for the notification-area icon.
      description: Answers only to loopback requests without forwarding headers; `404` otherwise.
      security: []
      responses:
        "200":
          description: Counts.
          content:
            application/json:
              schema:
                type: object
                required: [version, needs_setup, targets, down, port, port_configured]
                properties:
                  version: { type: string }
                  needs_setup: { type: boolean }
                  targets: { type: integer }
                  down: { type: integer }
                  port: { type: integer }
                  port_configured: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /api/brand/logo:
    get:
      tags: [brand]
      operationId: getLogo
      summary: The custom logo image.
      responses:
        "200":
          description: The image, served with `nosniff` and a sandbox CSP.
          content:
            image/png: {}
            image/jpeg: {}
            image/gif: {}
            image/webp: {}
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
    post:
      tags: [brand]
      operationId: setLogo
      summary: Upload a custom logo (admin only); the body is the image file.
      description: PNG, JPEG, GIF or WebP, up to 256 KB; the type is read from the bytes.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, contentMediaType: application/octet-stream }
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
    delete:
      tags: [brand]
      operationId: clearLogo
      summary: Remove the custom logo (admin only).
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/i18n:
    get:
      tags: [info]
      operationId: getStrings
      summary: Console strings for one language.
      security: []
      parameters:
        - name: lang
          in: query
          description: Language tag; without it, the best match for `Accept-Language`.
          schema: { type: string }
      responses:
        "200":
          description: The catalogue.
          content:
            application/json:
              schema:
                type: object
                required: [lang, langs, names, s]
                properties:
                  lang: { type: string }
                  langs: { type: array, items: { type: string } }
                  names: { type: object, additionalProperties: { type: string } }
                  s:
                    type: object
                    description: Message id to translated string.
                    additionalProperties: { type: string }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /api/version:
    get:
      tags: [info]
      operationId: getVersion
      summary: Build version; instance settings too with a session.
      security:
        - {}
        - session: []
      responses:
        "200":
          description: >
            `version` for everyone; with a session also `retention_days`,
            `hot_days`, `has_logo`, `needs_setup` and `authed`.
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version: { type: string }
                  retention_days: { type: integer }
                  hot_days: { type: integer }
                  has_logo: { type: boolean }
                  needs_setup: { type: boolean }
                  authed: { type: boolean }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /api/probe-types:
    get:
      tags: [info]
      operationId: getProbeTypes
      summary: The probe types this build can run, in display order.
      responses:
        "200":
          description: Probe types.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProbeType" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /api/targets:
    get:
      tags: [targets]
      operationId: listTargets
      summary: Every target with its last-hour and last-day summary.
      responses:
        "200":
          description: Targets.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TargetItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
    post:
      tags: [targets]
      operationId: createTarget
      summary: Create a target (admin only). Unknown fields are refused.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TargetInput" }
      responses:
        "200":
          description: The created target.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Target" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/targets/{id}:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    put:
      tags: [targets]
      operationId: replaceTarget
      summary: Replace a target (admin only).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TargetInput" }
      responses:
        "200":
          description: The replaced target.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Target" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      tags: [targets]
      operationId: deleteTarget
      summary: Delete a target (admin only); its history is kept.
      responses:
        "200":
          description: The deleted target as it was.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Target" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/targets/export:
    get:
      tags: [targets]
      operationId: exportTargets
      summary: The target list as a `netping-targets` file download.
      responses:
        "200":
          description: See [targets-format.md](targets-format.md).
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetsFile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/targets/import:
    post:
      tags: [targets]
      operationId: importTargets
      summary: Import a `netping-targets` file (admin only).
      parameters:
        - name: dry_run
          in: query
          description: "`1`, `true` or `yes`: report the plan without applying it."
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TargetsFile" }
      responses:
        "200":
          description: What was (or would be) imported.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportPlan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/series:
    get:
      tags: [data]
      operationId: getSeries
      summary: Rounds for one target, raw up to a day and hourly beyond.
      parameters:
        - name: target
          in: query
          required: true
          schema: { type: string }
        - name: minutes
          in: query
          description: Recent window; default 360, at most 300 days. Used when `from` or `to` is missing.
          schema: { type: integer }
        - name: from
          in: query
          description: Unix seconds.
          schema: { type: integer, format: int64 }
        - name: to
          in: query
          description: Unix seconds.
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: See "`/api/series` format" in API.md.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Series" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /api/stats:
    get:
      tags: [data]
      operationId: getStats
      summary: Per-target summary of the last 5 minutes, for Zabbix.
      description: Registered only when pingping runs with `--zabbix` and a token.
      security:
        - bearer: []
      responses:
        "200":
          description: Summary.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatsReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "429": { $ref: "#/components/responses/RateLimited" }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: pingping_session
    bearer:
      type: http
      scheme: bearer
      description: The read-only Zabbix token; accepted by `GET /api/stats` only.
  parameters:
    TargetID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
  responses:
    BadRequest:
      description: Bad input.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or bad credential.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: A viewer account, or a cross-origin browser request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MethodNotAllowed:
      description: Wrong method for this path.
      headers:
        Allow:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflicts with the current state (name taken, last admin, already set up).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooLarge:
      description: Request body too large.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnsupportedMediaType:
      description: Content-Type is not `application/json`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many failed attempts from this address.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Internal:
      description: Server error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error, code]
      properties:
        error: { type: string, description: For a person. }
        code:
          type: string
          description: For a program; fixed per status.
          enum: [bad_request, unauthorized, forbidden, not_found, method_not_allowed, conflict,
                 too_large, unsupported_media_type, rate_limited, unavailable, internal]
    Credentials:
      type: object
      properties:
        user: { type: string }
        pass: { type: string }
    User:
      type: object
      required: [name, role, created]
      properties:
        name: { type: string }
        role: { type: string, enum: [admin, viewer] }
        created: { type: integer, format: int64, description: Unix seconds. }
    Me:
      type: object
      required: [user, role, version, data_dir, listen, port, bind, bind_pending, retention_days, has_logo]
      properties:
        user: { type: string }
        role: { type: string, enum: [admin, viewer] }
        version: { type: string }
        data_dir: { type: string }
        listen: { type: string }
        port: { type: integer }
        bind: { type: string, description: Bind address in use now. }
        bind_pending: { type: string, description: Bind address stored for the next start. }
        retention_days: { type: integer }
        has_logo: { type: boolean }
    Ok:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, const: true }
    OptionSpec:
      type: object
      required: [key, label, kind]
      properties:
        key: { type: string }
        label: { type: string }
        help: { type: string }
        kind: { type: string }
        required: { type: boolean }
        default: {}
        min: { type: integer }
        max: { type: integer }
        max_len: { type: integer }
        choices: { type: array, items: { type: string } }
    ProbeType:
      type: object
      required: [type, label, uses_port, options]
      properties:
        type: { type: string }
        label: { type: string }
        uses_port: { type: boolean }
        options: { type: array, items: { $ref: "#/components/schemas/OptionSpec" } }
    TargetInput:
      type: object
      additionalProperties: false
      properties:
        id: { type: integer, format: int64, description: Ignored; the path id wins on PUT. }
        name: { type: string }
        type: { type: string, description: A probe type from `/api/probe-types`; `icmp` when empty. }
        host: { type: string }
        port: { type: integer }
        pace: { type: string, enum: ["", fast, normal, slow] }
        interval_sec: { type: integer }
        options: { type: object, description: Keys per the type's options in `/api/probe-types`. }
    Target:
      type: object
      required: [id, name, type, host, port, pace, interval_sec]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        type: { type: string }
        host: { type: string }
        port: { type: integer }
        pace: { type: string }
        interval_sec: { type: integer }
        options: { type: object }
    Stats:
      type: object
      required: [rounds, p50, p90, p99, loss_pct, bursts]
      properties:
        rounds: { type: integer }
        p50: { type: number }
        p90: { type: number }
        p99: { type: number }
        loss_pct: { type: number }
        bursts: { type: integer }
    TargetItem:
      type: object
      required: [id, name, type, host, port, addr, interval_sec, interval_set, pace, down, last_1h, last_24h]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        type: { type: string }
        host: { type: string }
        port: { type: integer }
        addr: { type: string }
        interval_sec: { type: integer, description: Effective interval. }
        interval_set: { type: integer, description: Explicit override; 0 means from pace. }
        pace: { type: string }
        options: { type: object }
        down: { type: boolean }
        last_1h: { $ref: "#/components/schemas/Stats" }
        last_24h: { $ref: "#/components/schemas/Stats" }
    TargetsFile:
      type: object
      description: A `netping-targets` file; full schema in [targets.schema.json](targets.schema.json).
      required: [format, version, targets]
      properties:
        format: { type: string, const: netping-targets }
        version: { type: integer }
        name: { type: string }
        description: { type: string }
        targets: { type: array, items: { type: object } }
    ImportPlan:
      type: object
      required: [total, add, skip, invalid, dry_run, imported]
      properties:
        name: { type: string }
        description: { type: string }
        total: { type: integer }
        add:
          type: array
          items:
            type: object
            required: [row, type, host]
            properties:
              row: { type: integer }
              name: { type: string }
              type: { type: string }
              host: { type: string }
              port: { type: integer }
              pace: { type: string }
              interval: { type: integer }
              options: { type: object }
              restores_history: { type: boolean }
        skip:
          type: array
          items:
            type: object
            required: [row, name, code, reason]
            properties:
              row: { type: integer }
              name: { type: string }
              code: { type: string, enum: [exists, duplicate] }
              reason: { type: string }
        invalid:
          type: array
          items:
            type: object
            required: [row, error]
            properties:
              row: { type: integer }
              name: { type: string }
              error: { type: string }
        dry_run: { type: boolean }
        imported: { type: integer }
    Round:
      type: object
      required: [t, s, r, ms]
      properties:
        t: { type: integer, format: int64, description: Unix seconds. }
        s: { type: integer, description: Packets sent. }
        r: { type: integer, description: Replies received. }
        ms: { type: [array, "null"], items: { type: number } }
        b: { type: boolean, description: Flagged as a loss burst. }
        z: { type: number, description: Robust z-score behind the flag. }
    Bucket:
      type: object
      required: [t, loss, n]
      properties:
        t: { type: integer, format: int64 }
        q: { type: array, items: { type: number }, description: "min, p50, p90, p99, max in ms." }
        loss: { type: number, description: Percent of packets lost. }
        n: { type: integer }
        bursts: { type: integer }
    Series:
      type: object
      required: [tier]
      properties:
        tier: { type: string, enum: [raw, hourly] }
        rounds: { type: array, items: { $ref: "#/components/schemas/Round" } }
        buckets: { type: array, items: { $ref: "#/components/schemas/Bucket" } }
    StatsTarget:
      type: object
      required: [id, name, rounds, bursts]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        rounds: { type: integer }
        p50: { type: number }
        p90: { type: number }
        p99: { type: number }
        loss_pct: { type: number }
        bursts: { type: integer }
        up: { type: integer, enum: [0, 1] }
    StatsReport:
      type: object
      required: [window_sec, targets]
      properties:
        window_sec: { type: integer }
        targets: { type: array, items: { $ref: "#/components/schemas/StatsTarget" } }
